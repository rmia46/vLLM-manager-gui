name: Build & Release vLLM Manager GUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Compressed Multi-Platform Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: vLLM-Manager-Linux-x86_64
            asset_name: vLLM-Manager-Linux-x86_64.tar.gz
          - os: windows-latest
            artifact_name: vLLM-Manager-Windows-x64.exe
            asset_name: vLLM-Manager-Windows-x64.zip
          - os: macos-latest
            artifact_name: vLLM-Manager-macOS-x64
            asset_name: vLLM-Manager-macOS-x64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UPX (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y upx
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install upx || true
          fi

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 qtawesome huggingface_hub requests psutil pyinstaller

      - name: Build Executable (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed --strip \
            --exclude-module tkinter \
            --exclude-module scipy \
            --exclude-module matplotlib \
            --name="${{ matrix.artifact_name }}" \
            --add-data "logo.svg:." \
            main.py
          tar -czvf ${{ matrix.asset_name }} -C dist ${{ matrix.artifact_name }}

      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --exclude-module tkinter `
            --exclude-module scipy `
            --exclude-module matplotlib `
            --name="vLLM-Manager-Windows-x64" `
            --add-data "logo.svg;." `
            main.py
          Compress-Archive -Path "dist/vLLM-Manager-Windows-x64" -DestinationPath "${{ matrix.asset_name }}" -CompressionLevel Optimal

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Flatten Asset Directories
        run: |
          mkdir -p final-assets
          find release-assets/ -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} final-assets/ \;
          ls -lh final-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-assets/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
